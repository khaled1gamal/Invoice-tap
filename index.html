<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0b1120">
  <meta name="description"
    content="نظام حساب وفواتير نظارات الريان المتطور للبصريات - ALRAYYAN OPTICS Secure Invoice & Billing Portal">
  <title>نظارات الريان | ALRAYYAN OPTICS - بوابة الفواتير الآمنة</title>

  <!-- Google Fonts: Cairo for Arabic & Plus Jakarta Sans for numbers and English -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-locked">
  <!-- Ambient background glow elements -->
  <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow-2" aria-hidden="true"></div>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- ==============================================
       1. LOGIN & AUTHENTICATION PORTAL
       (Visible when locked - Prevents any data from showing in Inspect)
       ============================================== -->
  <div id="loginPortal" class="login-portal" aria-labelledby="loginTitle">
    <div class="login-card glass-card">
      <div class="login-brand">
        <div class="login-logo-ring">
          <div class="brand-logo login-logo">
            <!-- Premium Eyewear SVG Icon -->
            <svg class="optics-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="15" cy="24" r="10" stroke="currentColor" stroke-width="3.5" fill="none" />
              <circle cx="33" cy="24" r="10" stroke="currentColor" stroke-width="3.5" fill="none" />
              <path d="M25 24H23" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
              <path d="M5 24H2" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
              <path d="M46 24H43" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
              <circle cx="15" cy="24" r="5" fill="currentColor" fill-opacity="0.18" />
              <circle cx="33" cy="24" r="5" fill="currentColor" fill-opacity="0.18" />
            </svg>
          </div>
        </div>
        
        <h1 id="loginTitle" class="brand-name">نظارات الريان</h1>
        <p class="brand-sub">ALRAYYAN OPTICS • بوابة الفواتير والحسابات</p>

        <div class="secure-badge">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>نظام مشفر ومحمي برمز وصول ضد الفحص (Inspect Protected)</span>
        </div>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div id="loginErrorBanner" class="login-error-banner haid" role="alert">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>اسم المستخدم أو كلمة المرور غير صحيحة!</span>
        </div>

        <div class="input-field">
          <label for="loginUsername">اسم المستخدم <small>Username</small></label>
          <div class="input-with-action">
            <input type="text" id="loginUsername" class="form-control" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
            <span class="inline-input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
          </div>
        </div>

        <div class="input-field">
          <label for="loginPassword">كلمة المرور / الرمز السري <small>Password</small></label>
          <div class="input-with-action">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" id="togglePasswordVisibilityBtn" class="inline-action-btn" title="إظهار / إخفاء كلمة المرور">
              <svg id="eyeShowIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eyeHideIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="primary-btn pulse-action">
          <span class="btn-text-main">دخول للنظام وفتح الفاتورة</span>
          <small>Unlock System</small>
        </button>

        <div class="login-hint-box">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>بيانات الدخول الافتراضية: <strong>admin</strong> | كلمة المرور: <strong>rayyan@2026</strong></span>
        </div>
      </form>
    </div>
  </div>

  <!-- ==============================================
       2. PROTECTED APP ROOT CONTAINER
       (COMPLETELY EMPTY IN INITIAL DOM UNTIL LOGGED IN!)
       ============================================== -->
  <div id="appProtectedRoot" class="app-protected-root" style="display: none;"></div>

  <!-- ==============================================
       3. MODAL: SECURITY & CHANGE CREDENTIALS
       ============================================== -->
  <div id="securityModal" class="security-modal" aria-hidden="true">
    <div class="modal-overlay" id="secModalOverlay"></div>
    <div class="modal-card glass-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="card-icon gold-accent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <div>
            <h3>إعدادات الأمان وحماية الفاتورة</h3>
            <p>Security Settings & Credentials</p>
          </div>
        </div>
        <button id="closeSecModalBtn" class="icon-btn close-btn" title="إغلاق">✕</button>
      </div>

      <form id="changeAuthForm" class="security-form" novalidate>
        <div id="secErrorBanner" class="login-error-banner haid" role="alert"></div>

        <div class="input-field">
          <label for="currPassInput">كلمة المرور الحالية <small>Current Password</small></label>
          <input type="password" id="currPassInput" class="form-control" placeholder="أدخل كلمة المرور الحالية" required>
        </div>

        <div class="input-field">
          <label for="newUserInput">اسم المستخدم الجديد <small>New Username</small></label>
          <input type="text" id="newUserInput" class="form-control" placeholder="admin" required>
        </div>

        <div class="input-field">
          <label for="newPassInput">كلمة المرور الجديدة <small>New Password</small></label>
          <input type="password" id="newPassInput" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="input-field">
          <label for="confirmPassInput">تأكيد كلمة المرور الجديدة <small>Confirm New Password</small></label>
          <input type="password" id="confirmPassInput" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="sec-modal-actions">
          <button type="submit" class="primary-btn">حفظ وتحديث بيانات الدخول</button>
          <button type="button" id="resetDefaultAuthBtn" class="text-btn danger-text">استعادة البيانات الافتراضية (admin / rayyan@2026)</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Encrypted application template script -->
  <script src="app-template.js"></script>
  <!-- Main application controller with security & anti-inspect layers -->
  <script src="main.js"></script>
</body>

</html>
